[package]
name = "leafy-financas"
version = "0.1.0"
description = "Simple, visual, local-first personal finance"
authors = ["Leafy contributors"]
edition = "2021"

[lib]
name = "leafy_financas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.23"
local-ip-address = "0.6"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
subtle = "2"
tauri-plugin-opener = "2"

# The installable GitHub APK uses the hardened Android debug variant for
# automatic signing. Keep its native core optimized and free of debug symbols.
[profile.dev]
opt-level = 2
debug = 0
strip = "symbols"
incremental = false

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
