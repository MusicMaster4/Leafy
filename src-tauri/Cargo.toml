[package]
name = "lumina-financas"
version = "0.1.0"
description = "Finanças pessoais simples, visuais e locais"
authors = ["Lumina"]
edition = "2021"

[lib]
name = "lumina_financas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
